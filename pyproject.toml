[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "number-guessing-game"
version = "0.1.0"
description = "A reusable number-guessing game engine with validation, scoring, and feedback."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Furqan Ali" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["number_guessing_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
